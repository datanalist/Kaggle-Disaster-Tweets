[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "kaggle_disaster_tweets"
version = "0.0.1"
description = "\u0420\u0435\u0448\u0435\u043d\u0438\u0435 \u0441\u043e\u0440\u0435\u0432\u043d\u043e\u0432\u0430\u043d\u0438\u044f \u043e\u0442 Kaggle: Natural Language Processing with Disaster Tweets"
authors = [
  { name = "datanalist" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
dependencies = [
    "loguru",
    "mkdocs",
    "pip",
    "pre-commit>=4.3.0",
    "python-dotenv",
    "ruff",
    "tqdm",
    "typer",
]
requires-python = "~=3.13.0"


[tool.ruff]
line-length = 99
src = ["kaggle_disaster_tweets"]
include = ["pyproject.toml", "kaggle_disaster_tweets/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["kaggle_disaster_tweets"]
force-sort-within-sections = true

